server:
  port: 0
spring:
  config:
    import: optional:file:../.env[.properties],optional:file:./.env[.properties]
  application:
    name: userService
  ## MongoDB Properties
  data:
    mongodb:
      authentication-database: admin
      username: rootuser
      password: rootpass
      database: user
      port: 27018
      host: localhost
      auto-index-creation: true
  ## Zipkin and Sleuth Properties
  zipkin:
    base-url: http://localhost:9411
  sleuth:
    sampler:
      probability: 1.0

## Eureka Properties
eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER}:${EUREKA_PASSWORD}@localhost:8761/eureka
    fetch-registry: true
    register-with-eureka: true

# JWT properties
jwt:
  secret:
    key: ${JWT_SECRET}
